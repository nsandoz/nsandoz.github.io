<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Gallery | Nicky Sandoz Photography</title>
      <meta name="description" content="Browse the photo gallery of Nicky Sandoz Photography — portraits, engagements, graduations, and more.">
      <link rel="stylesheet" type="text/css" href="stylesheet.css">
      <link rel="stylesheet" type="text/css" href="css/gallery.css">
      <script src="js/gallery-grid.js" defer></script>
   </head>
   <body>
      <div class="header">
         <!-- Top Navigation Menu -->
         <div class="logoAlign"><a class="logo" href="index.html">Nicky Sandoz Photography</a></div>
         <nav>
            <ul>
               <li><a href="index.html">Home</a></li>
               <li><a href="about.html">About</a></li>
               <li class="selected"><a href="gallery.html">Photo Gallery</a></li>
               <li><a href="contact.html">Book a Session</a></li>
            </ul>
         </nav>
      </div>
      <!-- Main Body Content -->
      <main class="gallery-page">
         <div class="gallery-intro">
            <h1>Portfolio</h1>
            <p>Portraits, engagements, graduations, and everything in between. Click or tap any photo to see it full screen.</p>
         </div>

         <!-- Photos are injected by js/gallery-grid.js from gallery-images.json -->
         <div id="gallery-status" class="gallery-status">
            <div class="spinner"></div>
            Loading the gallery&hellip;
         </div>
         <div id="gallery-grid" class="masonry"></div>
      </main>

      <!-- Lightbox: three slides so a swipe reveals the real neighbouring photo -->
      <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
         <div class="lightbox-bar">
            <span class="lightbox-counter" aria-live="polite"></span>
            <button type="button" class="lightbox-close" aria-label="Close photo viewer">&times;</button>
         </div>
         <div class="lightbox-stage">
            <div class="lightbox-track">
               <div class="lightbox-slide"><img src="" alt=""></div>
               <div class="lightbox-slide"><img src="" alt=""></div>
               <div class="lightbox-slide"><img src="" alt=""></div>
            </div>
            <button type="button" class="lightbox-arrow lightbox-prev" aria-label="Previous photo">&#10094;</button>
            <button type="button" class="lightbox-arrow lightbox-next" aria-label="Next photo">&#10095;</button>
         </div>
      </div>
      <!-- End of Main Body Content -->
      <!-- Begin Footer Content -->
      <footer class="block-a">
         <div class="footer-block">
            <div class="location-block">
               <h5>Contact Me</h5>
               <p>(949) 244-2421 <br/>
                  <a href="https://www.instagram.com/nickysandozphotography/">Instagram</a> <br/>
                  <a href="https://www.linkedin.com/in/nicky-sandoz/">LinkedIn</a> <br/>
                  <a href="mailto:nickysandozphotography@gmail.com">Email</a>
               </p>
            </div>
         </div>
      </footer>
      <!-- End Footer Content -->
   </body>
</html>
