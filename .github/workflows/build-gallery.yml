name: Build gallery

# Regenerates the photo grid in gallery.html whenever the photos in
# images/gallery/ change, so adding a photo to the site is just: drop the file
# in that folder, commit, push. The workflow commits the regenerated
# gallery.html back to the branch, and GitHub Pages then publishes it.
on:
  push:
    branches: [master]
    paths:
      - 'images/gallery/**'
      - 'tools/build_gallery.py'
      - '.github/workflows/build-gallery.yml'
  # Lets you re-run it by hand from the Actions tab if you ever need to.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-gallery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        # A shallow checkout is enough. This used to fetch full history so that
        # photos without an EXIF date could be ordered by when they entered git,
        # but ordering now comes from the filename, which needs no history at all.

      - name: Regenerate the gallery grid
        run: python3 tools/build_gallery.py

      - name: Commit the result
        run: |
          if git diff --quiet -- gallery.html; then
            echo "gallery.html already matches images/gallery/ - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery.html
          git commit -m "Rebuild the gallery grid from images/gallery/

          Regenerated by tools/build_gallery.py via the build-gallery workflow,
          in response to a change under images/gallery/."
          git push
