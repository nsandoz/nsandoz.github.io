name: Auto-Generate Gallery

# Rebuilds gallery-images.json (filenames plus each photo's real pixel
# dimensions) whenever photos are added to or removed from images/Portfolio/,
# so gallery.html picks up new work without any hand-editing.

on:
  push:
    branches: [ master ]
    paths:
      - 'images/Portfolio/**'
      - 'update-gallery.py'
  workflow_dispatch:  # Allows manual triggering

permissions:
  contents: write

jobs:
  generate-gallery:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate gallery images JSON
      run: python3 update-gallery.py

    - name: Commit and push if changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add gallery-images.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update gallery images [skip ci]" && git push)
